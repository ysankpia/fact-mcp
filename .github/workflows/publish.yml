name: Publish

# Publishes to npm and opens a GitHub Release when a version tag is pushed.
#
# Authentication is OIDC (npm trusted publishing): no token is stored anywhere.
# npm verifies that this workflow, in this repository, is the one allowed to
# publish, and issues a short-lived credential for the duration of the job.
# Because the publish comes from a public repository, npm also attaches a
# provenance attestation that anyone can verify.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for OIDC
  contents: write # required to create the release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog section is read from history

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      # npm 11.5.1+ is required for trusted publishing. The Node version that
      # ships with the runner may be older, so pin both explicitly.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm version
        run: |
          npm --version
          node --version

      - run: bun install --frozen-lockfile

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Fail before publishing rather than shipping a version with no notes.
      - name: Verify the changelog has a section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          echo "found CHANGELOG section for $VERSION"

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke test the tools
        run: bun run test-matrix --delay=6500
        env:
          FACT_BIN: ${{ github.workspace }}/dist/index.js
          # Bare-name resolution calls GitHub's search API. Unauthenticated
          # calls allow 10 a minute and are counted per IP, which is shared on
          # hosted runners. This token is issued per workflow run, scoped to
          # this repository, and raises the limit to 30.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No NODE_AUTH_TOKEN and no .npmrc: the npm CLI detects the OIDC
      # environment and exchanges it for a short-lived publish credential.
      - name: Publish to npm
        run: npm publish

      # A tag alone does not create a release page, so this closes the gap
      # between "the package exists" and "the repository shows what changed".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::error::no release notes extracted for $VERSION"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
