name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify the bundle runs on Node
        run: |
          node --version
          echo '' | timeout 10 node dist/index.js 2>&1 | head -1

      - name: Smoke test the tools
        run: bun run test-matrix --delay=6500
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository standards
        run: bash scripts/repo-audit.sh --strict
