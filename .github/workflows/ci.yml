name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the job only needs the repository and the workflow-scoped token
# that the smoke matrix passes to the GitHub search API.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify the bundle runs on Node
        run: |
          node --version
          echo '' | timeout 10 node dist/index.js 2>&1 | head -1

      - name: Smoke test the tools
        run: bun run test-matrix --delay=6500
        env:
          # Point the matrix at the freshly built bundle rather than a global
          # install, so the test exercises the artifact this commit produces.
          FACT_BIN: ${{ github.workspace }}/dist/index.js
          # Bare-name resolution calls GitHub's search API. Unauthenticated
          # calls allow 10 a minute and are counted per IP, which is shared on
          # hosted runners. This token is issued per workflow run, scoped to
          # this repository, and raises the limit to 30.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  standards:
    runs-on: ubuntu-latest
    steps:
      # The audit compares the changelog against release tags, so it needs the
      # full history rather than the default single-commit clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository standards
        run: bash scripts/repo-audit.sh --strict
